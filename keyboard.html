<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PhoneKB</title>
<style>
:root{--bg:#0e1015;--key:#272b35;--mod:#1c1f27;--on:#4f8cff;--lat:#d9822b;--tx:#e8eaf0;--dim:#8a90a0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:600 clamp(10px,3.2vh,16px) system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column;padding:max(2px,env(safe-area-inset-top)) max(4px,env(safe-area-inset-right)) max(2px,env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left))}
#bar{flex:none;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);padding:0 4px;height:3.8vh;min-height:16px}
#dot{width:8px;height:8px;border-radius:50%;background:#c33}#dot.ok{background:#3c6}
#dots{margin:0 auto;letter-spacing:5px;font-size:8px}#dots b{color:#444}#dots b.a{color:var(--tx)}
#fs{background:var(--key);color:var(--tx);border:0;border-radius:6px;padding:1px 10px;font:inherit}
#tb{flex:0 0 15vh;overflow:hidden}
#pages{display:flex;width:300%;height:100%;transition:transform .2s ease}
.pg{flex:0 0 33.3333%;display:flex}
.pg .k{flex:1;min-width:0}.pg .k.w4{flex:4}
#kb{flex:1;min-height:0;display:grid;grid-template-columns:repeat(398,1fr);grid-template-rows:repeat(10,1fr)}
.k,.padw{padding:2px;min-width:0;min-height:0;contain:layout paint}
.k i{display:flex;align-items:center;justify-content:center;height:100%;background:var(--key);border-radius:7px;font-style:normal;overflow:hidden}
.k.m i{background:var(--mod)}.k.on i{background:var(--on)}.k.lat i{background:var(--lat)}
i.np{justify-content:flex-start;padding:0 12px;color:var(--dim);font-weight:500}
#npt{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pad{height:100%;border-radius:9px;background:#161920;border:1px solid #2d3240;display:flex;align-items:center;justify-content:center;color:#4a5060;font-size:11px}
#turn{display:none;position:fixed;inset:0;z-index:9;background:var(--bg);align-items:center;justify-content:center;text-align:center;font-size:18px;padding:24px}
@media (orientation:portrait){#turn{display:flex}}
</style></head><body>
<div id="app">
  <div id="bar"><span id="dot"></span><span id="st">Đang kết nối…</span><span id="dots"></span><button id="fs">Toàn màn hình</button></div>
  <div id="tb"><div id="pages"></div></div>
  <div id="kb"></div>
</div>
<div id="turn">Xoay ngang điện thoại để dùng bàn phím</div>
<script>
const P={'`':'Backquote','-':'Minus','=':'Equal','[':'BracketLeft',']':'BracketRight',';':'Semicolon',"'":'Quote',',':'Comma','.':'Period','/':'Slash'};
const c=ch=>/[A-Z]/.test(ch)?'Key'+ch:/\d/.test(ch)?'Digit'+ch:P[ch];
const ks=s=>[...s].map(ch=>[ch,c(ch)]);
const MODS=new Set(['ShiftLeft','ShiftRight','ControlLeft','ControlRight','AltLeft','AltRight','MetaLeft']);
const els={},$=id=>document.getElementById(id);
function mk(l,code,tb){const e=document.createElement('div');e.className='k'+(MODS.has(code)?' m':'');e.innerHTML='<i></i>';e.firstChild.textContent=l;
  if(code[0]==='@')e.dataset.b=code[1];else{e.dataset.c=code;els[code]=e}if(tb)e.dataset.tb=1;return e}

// ---- Bàn phím chính (lưới 10 hàng, mỗi hàng phím = 2 đơn vị; phím mũi tên lên/xuống = 1 đơn vị)
const kb=$('kb'),X=15.4;
const place=(e,x,w,r,h)=>{e.style.gridColumn=`${Math.round(x*20)+1} / span ${Math.round(w*20)}`;e.style.gridRow=`${r} / span ${h}`;kb.append(e)};
const main=[
 [...ks('`1234567890-='),['⌫','Backspace',2]],
 [['Tab','Tab',1.5],...ks('QWERTYUIOP[]'),['\\','Backslash',1.5]],
 [['Caps','CapsLock',1.75],...ks("ASDFGHJKL;'"),['Enter','Enter',2.25]],
 [['Shift','ShiftLeft',2.25],...ks('ZXCVBNM,./'),['Shift','ShiftRight',2.75]],
 [['Ctrl','ControlLeft',1.25],['Win','MetaLeft',1.25],['Alt','AltLeft',1.25],['','Space',7.5],['Alt','AltRight',1.25],['Menu','ContextMenu',1.25],['Ctrl','ControlRight',1.25]]
];
main.forEach((row,i)=>{let x=0;row.forEach(([l,code,w=1])=>{place(mk(l,code),x,w,2*i+1,2);x+=w})});
[['Ins','Insert'],['Home','Home'],['PgUp','PageUp']].forEach(([l,code],i)=>place(mk(l,code),X+1.5*i,1.5,1,2));
[['Del','Delete'],['End','End'],['PgDn','PageDown']].forEach(([l,code],i)=>place(mk(l,code),X+1.5*i,1.5,3,2));
place(mk('←','ArrowLeft'),X,1.5,9,2);place(mk('↑','ArrowUp'),X+1.5,1.5,9,1);place(mk('↓','ArrowDown'),X+1.5,1.5,10,1);place(mk('→','ArrowRight'),X+3,1.5,9,2);
place(mk('Trái','@l'),X+3,1.5,5,2);place(mk('Phải','@r'),X+3,1.5,7,2);
const pw=document.createElement('div');pw.className='padw';pw.innerHTML='<div id="pad">Bàn di chuột</div>';place(pw,X,3,5,4);

// ---- Touch bar: vuốt trái/phải để đổi trang
const TB=[
 [['Esc','Escape'],...Array.from({length:12},(_,i)=>['F'+(i+1),'F'+(i+1)])],
 'media',
 [['Vol −','VolumeDown'],['Vol +','VolumeUp'],['Mute','VolumeMute'],['Sáng −','BrightnessDown'],['Sáng +','BrightnessUp'],['PrtSc','PrintScreen']]
];
TB.forEach(p=>{const d=document.createElement('div');d.className='pg';
  if(p==='media'){const n=document.createElement('div');n.className='k w4';n.dataset.tb=1;n.innerHTML='<i class="np"><span id="npt">Không có nhạc đang phát</span></i>';d.append(n);
    [['⏮','MediaTrackPrevious'],['⏯','MediaPlayPause'],['⏭','MediaTrackNext']].forEach(([l,code])=>d.append(mk(l,code,1)))}
  else p.forEach(([l,code])=>d.append(mk(l,code,1)));
  $('pages').append(d)});
let page=0;
function setPage(i){page=Math.max(0,Math.min(TB.length-1,i));$('pages').style.transform=`translateX(${-page*100/3}%)`;$('dots').innerHTML=TB.map((_,j)=>`<b class="${j===page?'a':''}">●</b>`).join('')}
setPage(0);

// ---- Kết nối
let T='';
try{T=new URLSearchParams(location.search).get('t')||localStorage.getItem('pkb')||'';localStorage.setItem('pkb',T)}catch(e){}
let ws;
const tx=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))},send=(t,k)=>tx({t,k});
function conn(){
  ws=new WebSocket('ws://'+location.host+'/ws?t='+encodeURIComponent(T));
  ws.onopen=()=>{$('dot').className='ok';$('st').textContent='Đã kết nối'};
  ws.onclose=()=>{$('dot').className='';$('st').textContent='Mất kết nối, đang thử lại…';reset();setTimeout(conn,1000)};
  ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.t==='np')$('npt').textContent=m.x||'Không có nhạc đang phát'}catch(_){}};
}
conn();

// ---- Phím: nhấn/nhả riêng, phím dính cho Shift/Ctrl/Alt/Win, touch bar phân biệt chạm và vuốt
const down=new Map(),latched=new Set(),vib=()=>navigator.vibrate&&navigator.vibrate(6);
const press=(d,s)=>d.b?tx({t:'b',b:d.b,s}):d.k&&send(s?'d':'u',d.k);
const relLatched=()=>{for(const m of latched){send('u',m);els[m].classList.remove('lat')}latched.clear()};
function reset(){down.clear();latched.clear();pt.clear();document.querySelectorAll('.on,.lat').forEach(e=>e.classList.remove('on','lat'))}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.k');if(!el)return;e.preventDefault();
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  vib();const k=el.dataset.c;
  if(k&&latched.has(k)){latched.delete(k);el.classList.remove('lat');send('u',k);return}
  const d={k,b:el.dataset.b,el,t:Date.now(),x:e.clientX,tb:!!el.dataset.tb};
  down.set(e.pointerId,d);
  if(d.tb)d.timer=setTimeout(()=>{if(!d.dead&&!d.sent&&d.k){d.sent=true;el.classList.add('on');press(d,1)}},170); // giữ >170ms mới coi là nhấn giữ
  else{d.sent=true;el.classList.add('on');press(d,1)}
});
addEventListener('pointermove',e=>{
  const d=down.get(e.pointerId);if(!d||!d.tb||d.dead)return;const dx=e.clientX-d.x;
  if(Math.abs(dx)>28){d.dead=true;clearTimeout(d.timer);if(d.sent){press(d,0);d.el.classList.remove('on')}setPage(page+(dx<0?1:-1))}
});
function up(e){
  const d=down.get(e.pointerId);if(!d)return;down.delete(e.pointerId);clearTimeout(d.timer);if(d.dead)return;
  if(d.tb){if(d.k){if(!d.sent){press(d,1);d.el.classList.add('on');setTimeout(()=>d.el.classList.remove('on'),90)}else d.el.classList.remove('on');press(d,0);if(!MODS.has(d.k))relLatched()}return}
  if(!d.b&&MODS.has(d.k)&&Date.now()-d.t<350){latched.add(d.k);d.el.classList.replace('on','lat');return} // chạm nhanh = phím dính
  d.el.classList.remove('on');press(d,0);
  if(!d.b&&!MODS.has(d.k))relLatched();
}
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('contextmenu',e=>e.preventDefault());

// ---- Bàn di chuột: 1 ngón = di chuyển, chạm = click trái; 2 ngón = cuộn / chụm để zoom, chạm = click phải
const pad=$('pad'),pt=new Map(),mv={x:0,y:0,sx:0,sy:0,z:0};let g={},raf=0;
const cm=()=>{const a=[...pt.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}};
const take=k=>{const v=Math.trunc(mv[k]);mv[k]-=v;return v};
function flush(){raf=0;
  if(pt.size===2){const q=cm(),dd=q.d-g.d,cx=q.x-g.x,cy=q.y-g.y;g.d=q.d;g.x=q.x;g.y=q.y;
    if(Math.abs(dd)>1.5*Math.hypot(cx,cy))mv.z+=dd;else{mv.sy+=cy;mv.sx-=cx}}  // cuộn kiểu "tự nhiên"
  const x=take('x'),y=take('y'),sx=take('sx'),sy=take('sy'),z=take('z');
  if(x||y)tx({t:'m',x,y});if(sx||sy)tx({t:'s',x:sx,y:sy});if(z)tx({t:'z',z});
}
const sched=()=>{raf||(raf=requestAnimationFrame(flush))};
pad.addEventListener('pointerdown',e=>{e.preventDefault();if(pt.size>=2)return;pad.setPointerCapture(e.pointerId);
  pt.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pt.size===1)g={t:Date.now(),m:0,n:1};else{g.n=2;Object.assign(g,cm())}});
pad.addEventListener('pointermove',e=>{const p=pt.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;g.m+=Math.abs(dx)+Math.abs(dy);
  if(pt.size===1){mv.x+=dx*1.8;mv.y+=dy*1.8}sched()});
const padUp=e=>{if(!pt.delete(e.pointerId))return;
  if(!pt.size&&Date.now()-g.t<250&&g.m<12){const b=g.n===2?'r':'l';tx({t:'b',b,s:1});tx({t:'b',b,s:0})}};
pad.addEventListener('pointerup',padUp);pad.addEventListener('pointercancel',padUp);

const fs=$('fs');
fs.onclick=async()=>{try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(e){}};
document.onfullscreenchange=()=>{fs.hidden=!!document.fullscreenElement};
</script></body></html>
